<template>
    <div class="slds-container_x-large slds-container_center">
        <div class="slds-page-header slds-page-header_record-home">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:contact" size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span>Contact</span>
                                        <span class="slds-page-header__title slds-truncate" title={contact.name}>{contact.name}</span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">{contact.title} at {contact.account}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button
                                label={followLabel}
                                variant={followVariant}
                                icon-name={followIconName}
                                onclick={handleFollowToggle}>
                            </lightning-button>
                        </div>
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button label="Edit" variant="neutral"></lightning-button>
                                <lightning-button label="Delete" variant="neutral"></lightning-button>
                                <lightning-button label="Clone" variant="neutral"></lightning-button>
                                <lightning-button-menu
                                    alternative-text="More Actions"
                                    variant="border-filled"
                                    menu-alignment="right">
                                    <lightning-menu-item label="Send Email" value="send_email"></lightning-menu-item>
                                    <lightning-menu-item label="Log a Call" value="log_call"></lightning-menu-item>
                                    <lightning-menu-item label="New Task" value="new_task"></lightning-menu-item>
                                </lightning-button-menu>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__row slds-page-header__row_gutters">
                <div class="slds-page-header__col-details">
                    <ul class="slds-page-header__detail-row">
                        <li class="slds-page-header__detail-block">
                            <div class="slds-text-title slds-truncate" title="Email">Email</div>
                            <div class="slds-truncate" title={contact.email}>
                                <lightning-formatted-email value={contact.email}></lightning-formatted-email>
                            </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                            <div class="slds-text-title slds-truncate" title="Phone">Phone</div>
                            <div class="slds-truncate" title={contact.phone}>
                                <lightning-formatted-phone value={contact.phone}></lightning-formatted-phone>
                            </div>
                        </li>
                        <li class="slds-page-header__detail-block">
                            <div class="slds-text-title slds-truncate" title="Owner">Owner</div>
                            <div class="slds-truncate" title={contact.owner}>{contact.owner}</div>
                        </li>
                        <li class="slds-page-header__detail-block">
                            <div class="slds-text-title slds-truncate" title="Lead Source">Lead Source</div>
                            <div class="slds-truncate" title={contact.leadSource}>{contact.leadSource}</div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="slds-grid slds-gutters slds-m-top_medium">
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                <lightning-card title="Contact Information">
                    <div class="slds-p-around_small">
                        <div class="slds-grid slds-wrap slds-gutters_small">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input label="Full Name" value={contact.name} read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input label="Title" value={contact.title} read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input label="Account Name" value={contact.account} read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input label="Department" value={contact.department} read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input label="Email" value={contact.email} type="email" read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input label="Phone" value={contact.phone} type="tel" read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input label="Mobile" value={contact.mobile} type="tel" read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input label="Mailing Address" value={contact.mailingAddress} read-only></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                                <lightning-textarea label="Description" value={contact.description} read-only></lightning-textarea>
                            </div>
                        </div>
                    </div>
                </lightning-card>

                <lightning-card title="Related Records" class="slds-m-top_medium">
                    <lightning-layout multiple-rows="true" pull-to-boundary="small" class="slds-p-around_small">
                        <template for:each={relatedItems} for:item="item">
                            <lightning-layout-item key={item.id} size="12" class="related-row slds-p-vertical_x-small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div>
                                        <p class="slds-text-title_caps">{item.type}</p>
                                        <p class="slds-text-heading_small">{item.name}</p>
                                    </div>
                                    <div class="slds-text-align_right">
                                        <lightning-badge label={item.status}></lightning-badge>
                                        <p class="slds-text-body_small slds-m-top_x-small">{item.amount}</p>
                                    </div>
                                </div>
                            </lightning-layout-item>
                        </template>
                    </lightning-layout>
                </lightning-card>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <lightning-card title="Activity Timeline">
                    <div class="slds-p-around_small">
                        <ul class="slds-timeline">
                            <template for:each={timelineItems} for:item="item">
                                <li key={item.id} class="slds-timeline__item slds-m-bottom_small">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name={item.iconName} size="small"></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <p class="slds-truncate"><strong>{item.title}</strong></p>
                                                <p class="slds-text-body_small slds-text-color_weak">{item.date}</p>
                                            </div>
                                            <p class="slds-text-body_small slds-m-top_xx-small">{item.detail}</p>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
